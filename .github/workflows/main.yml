name: Orihost-Renew

on:
  schedule:
    - cron: '0 19 */12 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # job 级 env：step 的 if 只能读 job/workflow 级 env（读不到 secrets 上下文），
    # 所以把代理 Secret 提升到 job 级，if 用 env.X 判断；GitHub 日志会自动脱敏
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}
      ORIHOST_GOST_PROXY: ${{ secrets.ORIHOST_GOST_PROXY }}

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🐍 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      # ===== xray 代理（NODE_LINK 四协议，优先）=====
      # NODE_LINK 支持 vless/vmess/trojan/socks5 分享链接
      # 自动下载 xray-core v1.8.24（兼容 allowInsecure）、解析链接、
      # 起本地 SOCKS5:1080 + HTTP:1081 双入站，
      # 测通后写 IS_PROXY / PROXY_SERVER 到 $GITHUB_ENV
      # 注意：xray 内核不支持 hysteria2/tuic/anytls（sing-box 特性）
      - name: 🛡️ 启动 xray 代理
        if: ${{ env.NODE_LINK != '' }}
        run: bash scripts/setup_proxy.sh

      # ===== 出口 IP 质检（诊断：CF 拦截判断依据）=====
      # 若出口是机房/IDC 段（org 含 hosting/IDC/云厂商），CF 会在 TLS 层直接 RST
      # 真家宽显示运营商（Comcast/AT&T/德国电信/大陆电信联通等）
      - name: 🌐 出口 IP 质检
        if: ${{ env.NODE_LINK != '' }}
        run: |
          echo "--- 代理出口信息 ---"
          curl -s --max-time 15 -x socks5://127.0.0.1:1080 https://ipinfo.io/json | jq '{ip, org, city, country, hosting}'
          echo "--- 面板可达性（TLS 握手测试）---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 -x socks5://127.0.0.1:1080 https://panel.orihost.com/dashboard || echo "❌ TLS 握手失败（CF 拒绝出口 IP）"

      # ===== GOST 代理兜底（未配 NODE_LINK 时用）=====
      - name: 🛡️ 启动 GOST 代理（兜底）
        if: ${{ env.NODE_LINK == '' && env.ORIHOST_GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.ORIHOST_GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost

          # 将代理映射到本地 8080 端口
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3

          echo "🌐 当前代理IP（测试本地转发）："
          curl -s -x http://127.0.0.1:8080 https://api.ipify.org | sed 's/\([0-9]*\.[0-9]*\.\)[0-9]*\.[0-9]*/\1**.**/g'

      - name: 🚀 执行续期
        env:
          ORI_COOKIE: ${{ secrets.ORI_COOKIE }}
          TG_BOT: ${{ secrets.TG_BOT }}
          # xray 优先（写入 PROXY_SERVER），未配置则回退 GOST secret
          ORIHOST_GOST_PROXY: ${{ env.PROXY_SERVER || secrets.ORIHOST_GOST_PROXY }}
        run: python main.py
